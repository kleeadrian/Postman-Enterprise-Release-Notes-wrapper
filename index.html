<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Postman Enterprise App Release Notes</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23FF6C37%22/></svg>"
    />
    <script>
      // Apply saved theme before paint to avoid a flash.
      (function () {
        var saved = localStorage.getItem("theme");
        var prefersDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = saved || (prefersDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="./" aria-label="Postman">
          <img
            class="brand-logo brand-logo-light"
            src="assets/postman-logo.png"
            alt="Postman"
            height="22"
          />
          <img
            class="brand-logo brand-logo-dark"
            src="assets/postman-logo-white.png"
            alt=""
            aria-hidden="true"
            height="22"
          />
        </a>
        <div class="topbar-title">Postman Enterprise App Release Notes</div>
        <div class="topbar-actions">
          <button
            id="theme-toggle"
            class="icon-btn"
            type="button"
            aria-label="Toggle theme"
            title="Toggle theme"
          >
            <svg
              class="icon-sun"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4"></circle>
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
              ></path>
            </svg>
            <svg
              class="icon-moon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
            </svg>
          </button>
          <a
            class="topbar-link"
            href="https://dl.pstmn.io/api/version/notes?channel=enterprise"
            target="_blank"
            rel="noopener"
            >Raw JSON</a
          >
        </div>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar" aria-label="Version list">
        <div class="sidebar-header">
          <label for="version-search" class="sr-only">Search versions</label>
          <input
            id="version-search"
            type="search"
            placeholder="Search versions…"
            autocomplete="off"
          />
        </div>
        <nav id="version-list" class="version-list" aria-label="Versions"></nav>
      </aside>

      <section class="content" id="content-wrap">
        <div class="disclaimer" role="note">
          This is an open source project that's been created by a member of
          the community. Please refer to
          <a
            href="https://www.postman.com/release-notes/"
            target="_blank"
            rel="noopener noreferrer"
            >postman.com/release-notes</a
          >
          for any official release notes.
        </div>
        <div id="content">
          <div class="loading">Loading release notes…</div>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
